6IDB9XQ==";
        const allQuestions = JSON.parse(decodeURIComponent(escape(window.atob(encodedData))));
        
        let activeQuestions = [];
        let userAnswers = {}; // mapped by activeIndex -> optIdx
        let answeredStatus = {}; // mapped by activeIndex -> true/false

        // Fisher-Yates Shuffle Algorithm
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initExam() {
            // Shuffle all questions order
            let shuffled = shuffleArray(allQuestions);
            
            // For each question, also shuffle options and re-map correct answer index
            activeQuestions = shuffled.map(q => {
                let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                let shuffledOptions = shuffleArray(optionsWithIndex);
                
                let newAnswerIndex = shuffledOptions.findIndex(opt => opt.originalIndex === q.answer);
                
                return {
                    id: q.id,
                    originalNumber: q.id,
                    question: q.question,
                    options: shuffledOptions.map(o => o.text),
                    answer: newAnswerIndex
                };
            });

            userAnswers = {};
            answeredStatus = {};
            renderExam();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderExam() {
            const container = document.getElementById('questions-container');
            const palette = document.getElementById('palette-grid');
            
            let htmlContent = '';
            let paletteContent = '';

            activeQuestions.forEach((q, idx) => {
                let qNum = idx + 1; // แสดงเลขข้อ 1 ถึง 127 ตามลำดับที่สุ่มขึ้นมา
                let isAnswered = userAnswers[idx] !== undefined;

                htmlContent += `
                    <div id="q-card-${idx}" class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-md transition">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-semibold bg-cyan-950 text-cyan-300 px-3 py-1 rounded-full border border-cyan-800">ข้อที่ ${qNum} จาก ${activeQuestions.length} (ข้อเดิมชุดหลัก: #${q.originalNumber})</span>
                        </div>
                        <h2 class="text-lg font-medium text-slate-100 mb-4 whitespace-pre-line">${q.question}</h2>
                        <div class="space-y-2.5" id="options-${idx}">
                `;

                q.options.forEach((opt, optIdx) => {
                    let isDisabled = isAnswered ? 'disabled' : '';
                    let isChecked = userAnswers[idx] === optIdx ? 'checked' : '';
                    let labelStyle = "bg-slate-700/50 border-slate-600 hover:bg-slate-700 cursor-pointer";

                    if (isAnswered) {
                        if (optIdx === q.answer) {
                            labelStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-medium";
                        } else if (userAnswers[idx] === optIdx) {
                            labelStyle = "bg-rose-950/80 border-rose-500 text-rose-200 font-medium";
                        } else {
                            labelStyle = "bg-slate-800/40 border-slate-700 opacity-50";
                        }
                    }

                    htmlContent += `
                        <label id="label-${idx}-${optIdx}" class="flex items-center gap-3 p-3 rounded-lg border ${labelStyle} transition">
                            <input type="radio" name="question-${idx}" value="${optIdx}" ${isChecked} ${isDisabled} onchange="handleAnswer(${idx}, ${optIdx})" class="w-4 h-4 text-cyan-500 focus:ring-cyan-400 bg-slate-900 border-slate-600">
                            <span class="text-sm text-slate-200 whitespace-pre-line">${opt}</span>
                        </label>
                    `;
                });

                let feedbackHtml = '';
                if (isAnswered) {
                    let isCorrect = answeredStatus[idx];
                    let feedbackText = isCorrect ? '<span class="text-emerald-400 font-semibold">✅ ถูกต้องเยี่ยมมาก!</span>' : `<span class="text-rose-400 font-semibold">❌ ตอบผิด (เฉลยที่ถูกต้อง: ${q.options[q.answer]})</span>`;
                    feedbackHtml = `<div class="mt-3 text-sm p-3 rounded-lg bg-slate-900/60 border border-slate-700">${feedbackText}</div>`;
                }

                htmlContent += `
                        </div>
                        ${feedbackHtml}
                    </div>
                `;

                let paletteBtnClass = "w-10 h-10 rounded-lg text-sm font-bold bg-slate-700 text-slate-300 hover:bg-slate-600 transition flex items-center justify-center";
                if (isAnswered) {
                    paletteBtnClass = answeredStatus[idx] ? 
                        "w-10 h-10 rounded-lg text-sm font-bold bg-emerald-600 text-white flex items-center justify-center shadow" : 
                        "w-10 h-10 rounded-lg text-sm font-bold bg-rose-600 text-white flex items-center justify-center shadow";
                }

                paletteContent += `
                    <button id="palette-btn-${idx}" onclick="scrollToQuestion(${idx})" class="${paletteBtnClass}">
                        ${qNum}
                    </button>
                `;
            });

            container.innerHTML = htmlContent;
            palette.innerHTML = paletteContent;
            updateStats();
        }

        function handleAnswer(qIdx, optIdx) {
            if (userAnswers[qIdx] !== undefined) return;

            userAnswers[qIdx] = optIdx;
            let isCorrect = (optIdx === activeQuestions[qIdx].answer);
            answeredStatus[qIdx] = isCorrect;

            renderExam();
        }

        function updateStats() {
            const answeredCount = Object.keys(userAnswers).length;
            let correctCount = 0;
            for (let idx in answeredStatus) {
                if (answeredStatus[idx]) correctCount++;
            }
            document.getElementById('score-counter').innerText = correctCount;
            document.getElementById('answered-counter').innerText = answeredCount;
            document.getElementById('progress-text').innerText = `${answeredCount} / ${activeQuestions.length}`;
        }

        function scrollToQuestion(idx) {
            const card = document.getElementById(`q-card-${idx}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.classList.add('border-cyan-500');
                setTimeout(() => card.classList.remove('border-cyan-500'), 1500);
            }
        }

        function startNewExam() {
            if (Object.keys(userAnswers).length > 0) {
                if (!confirm("การสุ่มใหม่จะรีเซ็ตคำตอบปัจจุบันทั้งหมด คุณต้องการสุ่มข้อสอบใหม่ใช่หรือไม่?")) {
                    return;
                }
            }
            initExam();
        }

        window.onload = () => {
            initExam();
        };
    </script>
